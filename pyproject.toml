[project]
name = "llm-redteam"
version = "0.1.0"
description = "Red-teaming small chat models: GCG and PAIR jailbreaks with attribution and probe-based detection"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "captum>=0.9.0",
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "peft>=0.21.2",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
